xt><line x1="466" y1="296" x2="364" y2="296" stroke="#7fd6a0" stroke-width="1.4"  marker-end="url(#aG)"/><text x="415" y="288" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#7fd6a0" text-anchor="middle" font-weight="400" opacity="1">流式逐行转发</text><line x1="364" y1="392" x2="466" y2="392" stroke="#8aa4ff" stroke-width="1.4"  marker-end="url(#aA)"/><text x="415" y="384" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#8aa4ff" text-anchor="middle" font-weight="400" opacity="1">POST /api/state（快照）</text><line x1="914" y1="250" x2="986" y2="250" stroke="#c9a6ff" stroke-width="1.4"  marker-end="url(#aV)"/><text x="950" y="242" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#c9a6ff" text-anchor="middle" font-weight="400" opacity="1">契约</text><line x1="986" y1="300" x2="914" y2="300" stroke="#7fd6a0" stroke-width="1.4"  marker-end="url(#aG)"/><text x="950" y="292" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.5" fill="#7fd6a0" text-anchor="middle" font-weight="400" opacity="1">token</text><rect x="490" y="544" width="400" height="52" rx="10" fill="rgba(224,176,112,0.08)" stroke="#5a4a30" stroke-width="1" opacity="1"/><text x="506" y="576" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11.5" fill="#e0b070" text-anchor="start" font-weight="400" opacity="1">⚠  API Key 只写在服务端的 config.json —— 前端源码里搜不到</text></svg>