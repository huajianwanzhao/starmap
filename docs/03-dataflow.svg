  <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8aa4ff"/></marker>
  <marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9a6ff"/></marker>
  <marker id="aM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b84"/></marker>
  <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7fd6a0"/></marker>
</defs><rect width="1240" height="720" fill="#0b0e17"/><text x="54" y="58" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="23" fill="#e6ebf7" text-anchor="start" font-weight="600" opacity="1">③ 一次「点击概念」的完整数据流</text><text x="54" y="86" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#8b95ad" text-anchor="start" font-weight="400" opacity="1">这条链路上有四层缓存，命中任何一层都不消耗 token。</text><rect x="80" y="116" width="140" height="42" rx="10" fill="#131a2a" stroke="#2b3652" stroke-width="1" opacity="1"/><text x="150" y="143" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#8b95ad" text-anchor="middle" font-weight="600" opacity="1">用户</text><line x1="150" y1="166" x2="150" y2="672" stroke="#2b3652" stroke-width="1.4" stroke-dasharray="4 6" /><rect x="410" y="116" width="140" height="42" rx="10" fill="#131a2a" stroke="#2b3652" stroke-width="1" opacity="1"/><text x="480" y="143" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#8aa4ff" text-anchor="middle" font-weight="600" opacity="1">浏览器</text><line x1="480" y1="166" x2="480" y2="672" stroke="#2b3652" stroke-width="1.4" stroke-dasharray="4 6" /><rect x="730" y="116" width="140" height="42" rx="10" fill="#131a2a" stroke="#2b3652" stroke-width="1" opacity="1"/><text x="800" y="143" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#c9a6ff" text-anchor="middle" font-weight="600" opacity="1">本地服务</text><line x1="800" y1="166" x2="800" y2="672" stroke="#2b3652" stroke-width="1.4" stroke-dasharray="4 6" /><rect x="1020" y="116" width="140" height="42" rx="10" fill="#131a2a" stroke="#2b3652" stroke-width="1" opacity="1"/><text x="1090" y="143" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" fill="#7fd6a0" text-anchor="middle" font-weight="600" opacity="1">DeepSeek</text><line x1="1090" y1="166" x2="1090" y2="672" stroke="#2b3652" stroke-width="1.4" stroke-dasharray="4 6" /><line x1="150" y1="196" x2="480" y2="196" stroke="#8b95ad" stroke-width="1.4"  marker-end="url(#aA)"/><text x="315" y="188" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#8b95ad" text-anchor="middle" font-weight="400" opacity="1">点击讲义里带虚线的概念</text><rect x="492" y="223" width="236" height="30" rx="7" fill="rgba(255,255,255,0.03)" stroke="#2b3652" stroke-width="1" opacity="1"/><text x="502" y="242" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.8" fill="#8aa4ff" text-anchor="start" font-weight="400" opacity="1">本地建节点 → 挂到当前节点下 → 补间动画</text><line x1="480" y1="280" x2="800" y2="280" stroke="#8aa4ff" stroke-width="1.4"  marker-end="url(#aA)"/><text x="640" y="272" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#8aa4ff" text-anchor="middle" font-weight="400" opacity="1">POST /api/lecture  { 概念, 话题, 父节点, 来路, 已有概念表 }</text><rect x="552" y="307" width="236" height="30" rx="7" fill="rgba(255,255,255,0.03)" stroke="#2b3652" stroke-width="1" opacity="1"/><text x="562" y="326" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.8" fill="#c9a6ff" text-anchor="start" font-weight="400" opacity="1">查缓存：前端内存 → 服务端内存 → SQLite（命中即回放，0 token）</text><line x1="800" y1="364" x2="1090" y2="364" stroke="#c9a6ff" stroke-width="1.4"  marker-end="url(#aV)"/><text x="945" y="356" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#c9a6ff" text-anchor="middle" font-weight="400" opacity="1">POST /chat/completions（契约 prompt）</text><line x1="1090" y1="406" x2="800" y2="406" stroke="#7fd6a0" stroke-width="1.4"  marker-end="url(#aG)"/><text x="945" y="398" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#7fd6a0" text-anchor="middle" font-weight="400" opacity="1">流式返回 token 流</text><line x1="800" y1="448" x2="480" y2="448" stroke="#7fd6a0" stroke-width="1.4"  marker-end="url(#aG)"/><text x="640" y="440" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#7fd6a0" text-anchor="middle" font-weight="400" opacity="1">逐行转发：##INSIGHT … ##SCENE …</text><rect x="492" y="475" width="236" height="30" rx="7" fill="rgba(255,255,255,0.03)" stroke="#2b3652" stroke-width="1" opacity="1"/><text x="502" y="494" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.8" fill="#7fd6a0" text-anchor="start" font-weight="400" opacity="1">文字正在被写出来（不是转圈等）</text><rect x="552" y="517" width="236" height="30" rx="7" fill="rgba(255,255,255,0.03)" stroke="#2b3652" stroke-width="1" opacity="1"/><text x="562" y="536" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.8" fill="#c9a6ff" text-anchor="start" font-weight="400" opacity="1">四条质检 + 写入 lectures / generations</text><line x1="800" y1="574" x2="480" y2="574" stroke="#c9a6ff" stroke-width="1.4"  marker-end="url(#aV)"/><text x="640" y="566" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#c9a6ff" text-anchor="middle" font-weight="400" opacity="1">##CHECK ok 或 fail   +   ##CHILD ×4</text><rect x="492" y="601" width="236" height="30" rx="7" fill="rgba(255,255,255,0.03)" stroke="#2b3652" stroke-width="1" opacity="1"/><text x="502" y="620" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="10.8" fill="#8aa4ff" text-anchor="start" font-weight="400" opacity="1">长出下一步的岔路 + 全量快照落库</text></svg>