<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星图 · 首页原型</title>
<style>
  :root{
    --bg:#070912;
    --ink:#e9edf6;
    --muted:#7f8aa3;
    --accent:#8aa4ff;
    --line:rgba(255,255,255,.14);
    --font:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}

  .nebula{position:fixed;inset:-20%;pointer-events:none;
    background:
      radial-gradient(38% 30% at 22% 28%, rgba(88,110,255,.16), transparent 70%),
      radial-gradient(34% 26% at 78% 72%, rgba(150,90,255,.13), transparent 70%),
      radial-gradient(30% 24% at 55% 88%, rgba(60,200,255,.08), transparent 70%);
    filter:blur(8px);}
  .stars{position:fixed;inset:0;pointer-events:none}
  .star{position:absolute;border-radius:50%;background:#fff;opacity:.5;animation:twinkle 4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.16}50%{opacity:.85}}
  body[data-skin="minimal"] .stars{display:none}
  body[data-skin="minimal"] .nebula{background:radial-gradient(60% 50% at 50% 42%, rgba(90,110,200,.10), transparent 72%)}

  .topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px 28px;z-index:5}
  .brand{display:flex;align-items:center;gap:9px;font-size:13px;letter-spacing:.16em;color:var(--muted)}
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .skins{display:flex;gap:6px;background:rgba(255,255,255,.05);padding:4px;border-radius:999px;border:1px solid var(--line)}
  .skins button{background:none;border:0;color:var(--muted);font-family:inherit;font-size:12px;padding:6px 14px;border-radius:999px;cursor:pointer;transition:.25s}
  .skins button.active{background:rgba(255,255,255,.12);color:var(--ink)}

  .stage{height:100%;display:flex;align-items:center;justify-content:center;position:relative;z-index:2}
  .landing{width:min(660px,88vw);text-align:center;transition:opacity .5s,transform .5s}
  .landing.leaving{opacity:0;transform:translateY(-14px) scale(.98)}

  .kicker{font-size:13px;letter-spacing:.36em;color:var(--muted);margin-bottom:26px;text-indent:.36em;animation:rise .9s .1s both}
  h1{font-size:clamp(30px,5.2vw,52px);font-weight:300;letter-spacing:.02em;margin:0 0 46px;line-height:1.28;animation:rise .9s .22s both}
  h1 em{font-style:normal;color:var(--accent)}

  .ask{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding:10px 4px;width:100%;transition:border-color .35s,box-shadow .35s;animation:rise .9s .34s both}
  .ask:focus-within{border-color:var(--accent);box-shadow:0 14px 34px -22px var(--accent)}
  .ask input{flex:1;background:none;border:0;outline:none;color:var(--ink);font-family:inherit;font-size:clamp(15px,1.6vw,18px);padding:10px 2px}
  .ask input::placeholder{color:#5b6479}
  .ask button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font-size:17px;cursor:pointer;transition:.3s;flex:none}
  .ask button:hover{background:var(--accent);color:#0b0d16;border-color:transparent;transform:translateX(2px)}

  .hint{margin-top:16px;font-size:12px;color:#5b6479;letter-spacing:.06em;animation:rise .9s .44s both}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:34px;animation:rise .9s .56s both}
  .chips button{background:none;border:1px solid var(--line);color:var(--muted);font-family:inherit;font-size:12.5px;padding:7px 15px;border-radius:999px;cursor:pointer;transition:.28s}
  .chips button:hover{color:var(--ink);border-color:rgba(138,164,255,.6);background:rgba(138,164,255,.08)}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  .growing{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .6s;pointer-events:none}
  .growing.on{opacity:1;pointer-events:auto}
  .growing .q{font-size:13px;letter-spacing:.3em;color:var(--muted);margin-bottom:6px}
  .canvas{position:relative;width:min(680px,90vw);height:min(430px,52vh);margin-top:8px}
  .node{position:absolute;transform:translate(-50%,-50%) scale(.6);opacity:0;padding:9px 16px;border-radius:999px;font-size:13.5px;white-space:nowrap;border:1px solid rgba(138,164,255,.45);background:rgba(138,164,255,.10);color:#dbe3ff;transition:opacity .6s,transform .6s cubic-bezier(.2,.9,.3,1.4)}
  .node.seed{border-color:transparent;background:var(--accent);color:#0a0c15;font-weight:600;box-shadow:0 0 34px rgba(138,164,255,.55)}
  .node.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .link{position:absolute;height:1px;background:linear-gradient(90deg,rgba(138,164,255,.55),rgba(138,164,255,.05));transform-origin:left center;opacity:0;transition:opacity .8s}
  .link.show{opacity:1}
  .growing .caption{margin-top:22px;font-size:12.5px;color:#5b6479;letter-spacing:.08em}
  .growing .again{margin-top:18px;background:none;border:1px solid var(--line);color:var(--muted);font-family:inherit;font-size:12px;padding:7px 16px;border-radius:999px;cursor:pointer}
  .growing .again:hover{color:var(--ink);border-color:rgba(138,164,255,.6)}
</style>
</head>
<body data-skin="star">
  <div class="nebula"></div>
  <div class="stars" id="stars"></div>

  <div class="topbar">
    <div class="brand"><span class="dot"></span>星图</div>
    <div class="skins">
      <button data-skin-btn="star" class="active">星空</button>
      <button data-skin-btn="minimal">极简</button>
    </div>
  </div>

  <div class="stage">
    <section class="landing" id="landing">
      <div class="kicker">为好奇心点一盏灯</div>
      <h1>今天，想<em>搞懂</em>什么？</h1>
      <div class="ask">
        <input id="q" placeholder="输入任意概念、问题或课程名…" autocomplete="off" />
        <button id="go">→</button>
      </div>
      <div class="hint">按 Enter 开始 · 知识的星图会从这个问题生长</div>
      <div class="chips" id="chips">
        <button>梯度下降</button>
        <button>期权是什么</button>
        <button>傅里叶变换</button>
        <button>为什么天空是蓝的</button>
      </div>
    </section>

    <section class="growing" id="growing">
      <div class="q" id="gq"></div>
      <div class="canvas" id="canvas"></div>
      <div class="caption">知识的星图正在生长…</div>
      <button class="again" id="again">重新开始</button>
    </section>
  </div>

<script>
  (function(){
    var box = document.getElementById('stars');
    for (var i=0;i<150;i++){
      var s = document.createElement('div');
      s.className='star';
      var size = Math.random()*1.8+0.4;
      s.style.width=size+'px'; s.style.height=size+'px';
      s.style.left=(Math.random()*100)+'%'; s.style.top=(Math.random()*100)+'%';
      s.style.animationDelay=(Math.random()*4)+'s';
      s.style.animationDuration=(3+Math.random()*4)+'s';
      box.appendChild(s);
    }
  })();

  document.querySelectorAll('[data-skin-btn]').forEach(function(b){
    b.addEventListener('click', function(){
      document.body.dataset.skin = b.dataset.skinBtn;
      document.querySelectorAll('[data-skin-btn]').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
    });
  });

  var input = document.getElementById('q');
  document.getElementById('chips').addEventListener('click', function(e){
    if (e.target.tagName==='BUTTON'){ input.value=e.target.textContent; input.focus(); }
  });

  var children = ['损失函数','学习率','反向传播','局部最优','随机梯度下降'];
  function grow(){
    var text = (input.value || '梯度下降').trim();
    document.getElementById('gq').textContent = text;
    document.querySelector('.landing').classList.add('leaving');
    document.getElementById('growing').classList.add('on');

    var canvas = document.getElementById('canvas');
    canvas.innerHTML='';
    var W=canvas.clientWidth, H=canvas.clientHeight, cx=W/2, cy=H/2;

    var seed=document.createElement('div');
    seed.className='node seed'; seed.textContent=text;
    seed.style.left=cx+'px'; seed.style.top=cy+'px';
    canvas.appendChild(seed);
    setTimeout(function(){ seed.classList.add('show'); },120);

    children.forEach(function(label,i){
      var a=(-90 + i*(360/children.length) + (Math.random()*22-11))*Math.PI/180;
      var r=Math.min(W,H)*0.34 + Math.random()*22;
      var x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;

      var link=document.createElement('div');
      link.className='link';
      link.style.left=cx+'px'; link.style.top=cy+'px';
      link.style.width=r+'px';
      link.style.transform='rotate('+(a*180/Math.PI)+'deg)';
      canvas.appendChild(link);

      var node=document.createElement('div');
      node.className='node'; node.textContent=label;
      node.style.left=x+'px'; node.style.top=y+'px';
      canvas.appendChild(node);

      setTimeout(function(){ link.classList.add('show'); node.classList.add('show'); },420+i*230);
    });
  }

  document.getElementById('go').addEventListener('click', grow);
  input.addEventListener('keydown', function(e){ if (e.key==='Enter') grow(); });
  document.getElementById('again').addEventListener('click', function(){
    document.getElementById('growing').classList.remove('on');
    document.querySelector('.landing').classList.remove('leaving');
    document.getElementById('canvas').innerHTML='';
  });
</script>
</body>
</html>
