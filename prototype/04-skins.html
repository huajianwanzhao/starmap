<!doctype html>
<html lang="zh-CN" data-theme="star">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星图 · 配色皮肤</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
  :root{
    --bg:#070912; --ink:#e9edf6; --muted:#7f8aa3; --accent:#8aa4ff;
    --line:rgba(var(--shade),.14);
    --font:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}

  .nebula{position:fixed;inset:-20%;pointer-events:none;z-index:0;
    background:
      radial-gradient(38% 30% at 22% 28%, var(--glow1), transparent 70%),
      radial-gradient(34% 26% at 78% 72%, var(--glow2), transparent 70%),
      radial-gradient(30% 24% at 55% 88%, var(--glow3), transparent 70%);
}
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star{position:absolute;border-radius:50%;background:var(--star);opacity:.5;animation:twinkle 4s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.16}50%{opacity:.85}}

  /* ===== 第一屏 ===== */
  .screen-landing{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;transition:opacity .7s,transform .7s}
  .screen-landing.gone{opacity:0;transform:scale(1.06);pointer-events:none}
  .landing{width:min(660px,88vw);text-align:center}
  .kicker{font-size:13px;letter-spacing:.36em;color:var(--muted);margin-bottom:26px;text-indent:.36em;animation:rise .9s .1s both}
  .landing h1{font-size:clamp(30px,5.2vw,52px);font-weight:300;letter-spacing:.02em;margin:0 0 46px;line-height:1.28;animation:rise .9s .22s both}
  .landing h1 em{font-style:normal;color:var(--accent)}
  .ask{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding:10px 4px;width:100%;transition:border-color .35s,box-shadow .35s;animation:rise .9s .34s both}
  .ask:focus-within{border-color:var(--accent);box-shadow:0 14px 34px -22px var(--accent)}
  .ask input{flex:1;background:none;border:0;outline:none;color:var(--ink);font-family:inherit;font-size:clamp(15px,1.6vw,18px);padding:10px 2px}
  .ask input::placeholder{color:var(--dim)}
  .ask button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(var(--shade),.06);color:var(--ink);font-size:17px;cursor:pointer;transition:.3s;flex:none}
  .ask button:hover{background:var(--accent);color:var(--onaccent);border-color:transparent;transform:translateX(2px)}
  .hint{margin-top:16px;font-size:12px;color:var(--dim);letter-spacing:.06em;animation:rise .9s .44s both}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:34px;animation:rise .9s .56s both}
  .chips button{background:none;border:1px solid var(--line);color:var(--muted);font-family:inherit;font-size:12.5px;padding:7px 15px;border-radius:999px;cursor:pointer;transition:.28s}
  .chips button:hover{color:var(--ink);border-color:rgba(var(--acc1),.6);background:rgba(var(--acc1),.08)}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* ===== 星图 ===== */
  .screen-universe{position:fixed;inset:0;z-index:10;opacity:0;pointer-events:none;transition:opacity .8s;-webkit-user-select:none;user-select:none}
  /* 星图层一律不可选中（拖拽时不会再刷出蓝色高亮）；讲义正文与输入框除外 */
  .pbody, .pbody *{-webkit-user-select:text;user-select:text}
  .screen-universe input{-webkit-user-select:text;user-select:text}
  .screen-universe.on{opacity:1;pointer-events:auto}

  .topbar{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:30;pointer-events:none}
  .topbar > *{pointer-events:auto}
  .brandwrap{position:relative}
  .brand{display:flex;align-items:center;gap:9px;font-size:13px;letter-spacing:.16em;color:var(--ink);background:rgba(var(--surf),.94);border:1px solid rgba(var(--shade),.08);font-family:inherit;cursor:pointer;padding:8px 14px;border-radius:999px;transition:.25s;box-shadow:0 14px 40px -20px var(--shadow)}
  .brand:hover{background:rgba(var(--surf2),.96)}
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .brand .caret{font-size:9px;color:var(--muted);margin-left:2px}
  .menu{position:absolute;top:46px;left:0;min-width:290px;background:rgba(var(--surf2),.94);border:1px solid var(--line);border-radius:14px;padding:8px;backdrop-filter:blur(14px);box-shadow:0 24px 60px -20px var(--shadow);opacity:0;transform:translateY(-8px);pointer-events:none;transition:.25s}
  .menu.open{opacity:1;transform:none;pointer-events:auto}
  .menu .cap{font-size:10.5px;letter-spacing:.2em;color:var(--dim);padding:8px 10px 6px}
  .menu button.item{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;border:0;color:var(--ink);font-family:inherit;font-size:13.5px;padding:10px;border-radius:9px;cursor:pointer;text-align:left;transition:.2s}
  .menu button.item:hover{background:rgba(var(--acc1),.13)}
  .menu button.item .meta{font-size:11px;color:var(--muted);white-space:nowrap}
  .menu .sep{height:1px;background:var(--line);margin:7px 4px}
  .cdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:9px;vertical-align:middle}

  .controls{position:absolute;left:50%;top:13px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(var(--surf),.96);border:1px solid rgba(var(--shade),.1);border-radius:999px;padding:5px;box-shadow:0 18px 46px -20px var(--shadow)}
  .controls button{background:none;border:0;color:var(--muted);font-family:inherit;font-size:12px;padding:7px 13px;border-radius:999px;cursor:pointer;transition:.22s;white-space:nowrap}
  .controls button:hover{background:rgba(var(--shade),.14);color:var(--ink)}
  .controls button.active{background:rgba(var(--acc2),.18);color:var(--acct2)}

  .viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;z-index:10}
  .viewport.dragging{cursor:grabbing}
  .world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
  .links{position:absolute;left:0;top:0;overflow:visible}
  .links line{stroke-width:1;vector-effect:non-scaling-stroke;stroke:rgba(var(--acc1),.45);transition:stroke .4s}
  .links line.hot{stroke:rgba(var(--acc1),.95)}
  /* 星际航线：默认隐藏，只有需要时才浮现 */
  .links line.cross{stroke:rgba(var(--acc2),.7);stroke-dasharray:3 8;stroke-width:1.2;opacity:0;transition:opacity .55s}
  body.lanes-on .links line.cross{opacity:1}
  .links line.cross.hot{stroke:rgba(var(--acc2),1)}

  .node{position:absolute;transform:translate(-50%,-50%) scale(.4);opacity:0;padding:9px 16px;border-radius:999px;font-size:13.5px;white-space:nowrap;cursor:grab;transition:opacity .5s,transform .5s cubic-bezier(.2,.85,.3,1.25),background .3s,border-color .3s;transform-origin:50% 50%}
  .node:active{cursor:grabbing}
  /* 问题节点：圆角矩形，和胶囊状的概念明显不同 */
  .node.q{border-radius:13px;padding:11px 19px;font-size:14px;font-weight:600;box-shadow:0 0 34px -10px rgba(var(--acc1),.6)}
  .node .qmk{color:var(--accent);margin-right:8px;font-size:11px;opacity:.95}
  .node .mk{color:var(--acct2);margin-left:8px;font-size:10px}
  .node .rel{font-size:10px;letter-spacing:.06em;opacity:.65;margin-left:7px}
  .node.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .node.visited{background:rgba(var(--acc1),.9);color:var(--onaccent);border-color:transparent;font-weight:600;box-shadow:0 0 26px rgba(var(--acc1),.45)}
  body.lanes-on .node.shared{border-style:dashed}
  .node.pulse:after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:1px solid var(--accent);animation:pulse 1.1s ease-out 2}
  .node.show.dim{opacity:0;transform:translate(-50%,-50%) scale(.62);pointer-events:none}
  .node.picked{outline:2px solid rgba(var(--acc2),.95);outline-offset:3px;box-shadow:0 0 34px -6px var(--acct2)}
  .links line.cross.manual{stroke:rgba(var(--acc1),.8)}
  .links line.dim{opacity:0}
  body.lanes-on .links line.cross.dim{opacity:0}
  @keyframes pulse{from{transform:scale(.9);opacity:.9}to{transform:scale(1.5);opacity:0}}

  .clabel{position:absolute;transform:translate(-50%,-50%);font-size:11px;letter-spacing:.4em;color:rgba(var(--acc1),.5);white-space:nowrap;pointer-events:none}
  body.far .clabel{color:rgba(var(--acc1),.85);font-size:12px}
  body.far .node{opacity:.35}
  body.far .node.root{opacity:.95}
  body.far .node.show.dim{opacity:0}

  /* ===== 面板 ===== */
  .panel{position:absolute;top:0;right:0;bottom:0;width:min(460px,42vw);background:rgba(var(--surf2),.985);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .5s cubic-bezier(.2,.8,.25,1);z-index:25;display:flex;flex-direction:column}
  .panel.open{transform:none;box-shadow:-40px 0 90px -40px var(--shadow)}
  .phead{display:flex;align-items:center;gap:8px;padding:16px 14px 10px;border-bottom:1px solid var(--line)}
  .phead .crumb{flex:1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ghost{background:none;border:1px solid transparent;color:var(--muted);font-family:inherit;font-size:14px;width:30px;height:30px;border-radius:8px;cursor:pointer;transition:.2s}
  .ghost:hover{background:rgba(var(--shade),.08);color:var(--ink)}
  .ghost.spin{animation:spin 1s linear infinite;color:var(--accent)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pbody{flex:1;overflow-y:auto;padding:26px 26px 60px}
  .pbody::-webkit-scrollbar{width:8px}
  .pbody::-webkit-scrollbar-thumb{background:rgba(var(--shade),.12);border-radius:8px}
  .badge{display:inline-block;font-size:10.5px;letter-spacing:.14em;color:var(--accent);border:1px solid rgba(var(--acc1),.4);background:rgba(var(--acc1),.08);padding:4px 10px;border-radius:999px;margin-bottom:16px}
  .badge.qb{color:var(--acct2);border-color:rgba(var(--acc2),.45);background:rgba(var(--acc2),.08)}
  .pbody h2{font-size:26px;font-weight:400;margin:0 0 12px}
  .pbody .summary{color:var(--ink3);font-size:14px;line-height:1.85;margin:0 0 24px;padding-left:14px;border-left:2px solid rgba(var(--acc1),.5)}
  .lecture p{font-size:14.5px;line-height:2.05;color:var(--ink2);margin:0 0 18px}
  .rv{opacity:0;transform:translateY(7px);transition:opacity .5s,transform .5s}
  .rv.on{opacity:1;transform:none}
  .insight{background:rgba(var(--acc1),.09);border:1px solid rgba(var(--acc1),.26);border-left:3px solid var(--accent);border-radius:10px;padding:14px 16px;margin:0 0 26px;font-size:15px;line-height:1.9;color:var(--ink2)}
  .insight b{display:block;font-size:10.5px;letter-spacing:.22em;color:var(--accent);font-weight:400;margin-bottom:8px}
  .insight .isk{display:block;font-size:13.5px;color:var(--muted);margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed rgba(var(--shade),.1)}
  .sec{margin:0 0 24px}
  .sech{font-size:10.5px;letter-spacing:.22em;color:var(--dim);margin:0 0 12px}
  .fbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 24px}
  .fbox .tex{font-size:19px;text-align:center;color:var(--ink);padding:8px 0 14px;overflow-x:auto}
  .fbox .fread{font-size:12.5px;color:var(--ink3);line-height:1.8;margin-bottom:12px;text-align:center}
  .fbox .fsym{font-size:12.5px;color:var(--ink3);line-height:1.95;display:flex;gap:10px}
  .fbox .fsym b{color:var(--acct1);font-weight:500;min-width:58px;flex:none}
  .fbox .fex{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink3);line-height:1.85}
  .drills button.asks{flex-direction:column;align-items:flex-start;gap:3px;padding:9px 14px}
  .askq{font-size:13px;color:var(--ink)}
  .askc{font-size:10.5px;color:#7f8aa3;letter-spacing:.04em}
  .fromline{font-size:12.5px;color:var(--ink3);line-height:1.85;margin:-6px 0 20px;padding-left:14px;border-left:2px solid rgba(var(--acc2),.45)}
  .term{color:var(--acct1);border-bottom:1px dashed rgba(var(--acc1),.6);cursor:pointer;transition:.2s;padding-bottom:1px}
  .term:hover{color:var(--inkhi);background:rgba(var(--acc1),.16);border-bottom-color:transparent;border-radius:3px}
  .kickerline{margin:34px 0 12px;font-size:11px;letter-spacing:.22em;color:var(--dim)}
  .drills{display:flex;flex-wrap:wrap;gap:8px}
  .drills button{background:rgba(var(--acc1),.07);border:1px solid rgba(var(--acc1),.28);color:var(--acct1);font-family:inherit;font-size:12.5px;padding:8px 14px;border-radius:999px;cursor:pointer;transition:.25s}
  .drills button:hover{background:rgba(var(--acc1),.2);color:var(--inkhi)}
  .drills button.lane{background:rgba(var(--acc2),.09);border-color:rgba(var(--acc2),.4);color:var(--acct2)}
  .drills button.lane:hover{background:rgba(var(--acc2),.22)}
  .lanenote{font-size:12.5px;color:var(--acct2s);line-height:1.85;margin:0 0 12px}

  .pfoot{flex:none;border-top:1px solid var(--line);padding:12px 16px 14px;background:rgba(var(--surf2),.55)}
  .askline{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:2px 2px 6px}
  .askline input{flex:1;background:none;border:0;outline:none;color:var(--ink);font-family:inherit;font-size:13.5px;padding:6px 0}
  .askline input::placeholder{color:var(--dim)}
  .askline button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(var(--shade),.06);color:var(--ink);cursor:pointer;font-size:14px;transition:.25s;flex:none}
  .askline button:hover{background:var(--accent);color:var(--onaccent);border-color:transparent}
  .followhint{margin-top:8px;font-size:11px;color:var(--dim);letter-spacing:.04em}

  /* ===== 面板 tab ===== */
  .ptabs{display:flex;gap:6px;padding:10px 14px 0}
  .ptabs button{flex:1;background:none;border:1px solid transparent;border-bottom:1px solid var(--line);color:#7f8aa3;font-family:inherit;font-size:12.5px;padding:9px 6px;border-radius:8px 8px 0 0;cursor:pointer;transition:.22s}
  .ptabs button:hover{color:var(--ink);background:rgba(var(--shade),.05)}
  .ptabs button.on{color:var(--ink);background:rgba(var(--acc1),.14);border-color:rgba(var(--acc1),.3);border-bottom-color:transparent}

  /* ===== 闪卡 ===== */
  .fc{padding:22px 0 0}
  .fc-card{perspective:1100px;cursor:pointer;height:min(420px,52vh)}
  .fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.25,1)}
  .fc-card.flipped .fc-inner{transform:rotateY(180deg)}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;border-radius:16px;border:1px solid var(--line);background:var(--card);padding:26px 22px;overflow-y:auto}
  .fc-back{transform:rotateY(180deg);background:rgba(var(--acc1),.09);border-color:rgba(var(--acc1),.3)}
  .fc-tag{font-size:10.5px;letter-spacing:.22em;color:var(--dim);margin-bottom:16px;flex:none}
  .fc-text{font-size:15px;line-height:1.95;color:var(--ink2)}
  .fc-front .fc-text{font-size:19px;line-height:1.7}
  .fc-hint{position:absolute;left:22px;right:22px;bottom:16px;font-size:11px;color:var(--dim);text-align:center}
  .fc-text .tex{font-size:18px;text-align:center;padding:10px 0 14px}
  .fc-read{font-size:12.5px;color:var(--ink3);text-align:center;margin-bottom:12px}
  .fc-sym{font-size:12.5px;color:var(--ink3);line-height:1.9;display:flex;gap:10px}
  .fc-sym b{color:var(--acct1);font-weight:500;min-width:58px;flex:none}
  .fc-bar{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
  .fc-bar button{background:rgba(var(--shade),.05);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:14px;width:46px;height:38px;border-radius:10px;cursor:pointer;transition:.22s}
  .fc-bar button:hover{background:rgba(var(--acc1),.18);border-color:rgba(var(--acc1),.4)}
  .fc-bar span{font-size:12.5px;color:#7f8aa3;letter-spacing:.08em}

  /* ===== 小地图 ===== */
  .minimap{position:absolute;left:22px;bottom:22px;width:184px;height:124px;border:1px solid var(--line);border-radius:12px;background:rgba(var(--surf2),.92);z-index:26;overflow:hidden;cursor:crosshair}
  .mm-dot{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
  .mm-view{position:absolute;border:1px solid rgba(var(--acc1),.7);border-radius:3px;background:rgba(var(--acc1),.07)}
  .mm-tip{position:absolute;left:9px;top:7px;font-size:9.5px;letter-spacing:.16em;color:var(--dim);pointer-events:none}

  /* ===== 合并建议 ===== */
  .askmerge{position:fixed;left:50%;bottom:9%;transform:translate(-50%,12px);width:min(520px,86vw);background:rgba(var(--surf2),.98);border:1px solid rgba(var(--acc2),.35);border-radius:16px;padding:20px 22px;backdrop-filter:blur(16px);box-shadow:0 30px 80px -30px var(--shadow);opacity:0;pointer-events:none;transition:.4s;z-index:60}
  .askmerge.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .askmerge .mt{font-size:11px;letter-spacing:.2em;color:var(--acct2s);margin-bottom:10px}
  .askmerge .mq{font-size:17px;color:var(--ink);margin-bottom:18px}
  .askmerge .ma{display:flex;gap:10px;flex-wrap:wrap}
  .askmerge .ma button{font-family:inherit;font-size:12.5px;padding:9px 16px;border-radius:999px;cursor:pointer;transition:.25s;border:1px solid var(--line);background:none;color:var(--muted)}
  .askmerge .ma button.primary{background:rgba(var(--acc2),.18);border-color:rgba(var(--acc2),.5);color:var(--acct2)}
  .askmerge .ma button:hover{color:var(--inkhi);border-color:rgba(var(--acc1),.7)}
  .aliasline{font-size:12.5px;color:var(--ink3);line-height:1.9;margin:-10px 0 24px;padding-left:14px}

  /* ===== 提示条 ===== */
  .toast{position:absolute;left:50%;top:84px;transform:translate(-50%,-12px);background:rgba(var(--surf2),.95);border:1px solid var(--line);color:var(--ink2);font-size:12.5px;padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.4s;z-index:40;white-space:nowrap}
  .toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== 肤色主题（新增）===== */
html[data-theme="star"],html[data-theme="star"] body{--bg:#070912;--ink:#e9edf6;--ink2:#dbe3f3;--ink3:#9fb0cd;--inkhi:#fff;--muted:#7f8aa3;--dim:#5b6479;--accent:#8aa4ff;--accent2:#c9a6ff;--acct1:#bcd0ff;--acct2:#dcc8ff;--acct2s:#9b8bbd;--onaccent:#0a0c15;--shade:255,255,255;--acc1:138,164,255;--acc2:196,150,255;--surf:7,9,18;--surf2:12,16,26;--card:rgba(255,255,255,.035);--shadow:#000;--star:#fff;--glow1:rgba(88,110,255,.15);--glow2:rgba(150,90,255,.12);--glow3:rgba(60,200,255,.07);--font-h:inherit;--nd-s:70%;--nd-bg-l:60%;--nd-bg-a:.10;--nd-bd-l:72%;--nd-bd-a:.42;--nd-tx-s:60%;--nd-tx-l:88%};--core-l:96%;--core-bd-l:99%;--core-tx:#0a0c15;--core-glow-l:88%}

.landing h1,.kicker,.sech,.phead h2{font-family:var(--font-h,var(--font))}
/* 星图节点胶囊：底色/描边/文字全部由主题变量驱动，色相(--h)仍按星团区分 */
/* ===== 三档层级：0 恒星（实心+柔光）/ 1 行星（半透明亮边）/ ≥2 卫星（几近透明细边）=====
   每一档只是给主题变量乘一组系数，所以五套皮肤自动适配，不需要五份配色。
   颜色一律走 CSS，不再写内联样式，这样 .visited / .picked 才能重新生效。 */
.node{--f-s:.72;--f-l:.95;--f-a:.86;--f-bd:1;--f-tx:.9;--nd-pad:9px 16px;--nd-fs:13.5px;
  transition:opacity .5s,transform .5s cubic-bezier(.2,.85,.3,1.25),background .35s,border-color .35s,color .35s}
.node.t1{--f-s:.94;--f-l:1.06;--f-a:1.35;--f-bd:1.45;--f-tx:1;--nd-pad:11px 18px;--nd-fs:14.5px}
.node.root{--f-s:1.12;--f-l:1.14;--f-a:2;--f-bd:2.05;--f-tx:1;--nd-pad:13px 21px;--nd-fs:16px;z-index:3;letter-spacing:.01em}
.node.root,.node.root.q,.node.t1,.node.t1.q,.node,.node.q{
  padding:var(--nd-pad);font-size:var(--nd-fs);
  background:hsl(var(--h,220) calc(var(--nd-s,70%) * var(--f-s)) calc(var(--nd-bg-l,60%) * var(--f-l)) / calc(var(--nd-bg-a,.10) * var(--f-a)));
  border:1px solid hsl(var(--h,220) calc(var(--nd-s,70%) * var(--f-s)) calc(var(--nd-bd-l,72%) * var(--f-l)) / calc(var(--nd-bd-a,.42) * var(--f-bd)));
  color:hsl(var(--h,220) calc(var(--nd-tx-s,60%) * var(--f-tx)) calc(var(--nd-tx-l,88%) * var(--f-tx)))
}
/* 恒星：文字用主题里对比度最高的那一档，外面罩一团柔和外发光 */
.node.root,.node.root.q{
  color:var(--inkhi,var(--ink));
  box-shadow:0 0 44px -14px hsl(var(--h,220) calc(var(--nd-s,70%) * 1.1) calc(var(--nd-bg-l,60%) * 1.14) / .62),
             0 0 112px -34px hsl(var(--h,220) calc(var(--nd-s,70%) * 1.1) calc(var(--nd-bg-l,60%) * 1.14) / .40)
}
/* 取代之前的两道同心圆环：恒星是自己发光的，不该被框起来。
   用 radial-gradient 而不是 filter:blur（这个项目有过卡顿史）。 */
.node.root::before{
  content:"";position:absolute;left:50%;top:50%;width:320px;height:320px;margin:-160px 0 0 -160px;
  border-radius:50%;pointer-events:none;z-index:-1;
  background:radial-gradient(circle,
    hsl(var(--h,220) calc(var(--nd-s,70%) * 1.1) calc(var(--nd-bg-l,60%) * 1.14) / .30) 0%,
    hsl(var(--h,220) calc(var(--nd-s,70%) * 1.1) calc(var(--nd-bg-l,60%) * 1.14) / .11) 36%,
    transparent 68%);
  animation:rootGlow 8s ease-in-out infinite
}
@keyframes rootGlow{0%,100%{opacity:.62}50%{opacity:1}}
.node.root .qmk{font-size:13.5px}

/* ===== 根节点配色 B：去色成近白/近墨（炽热的核心），由 html.hotcore 切换 ===== */
html.hotcore .node.root,html.hotcore .node.root.q{
  background:hsl(var(--h,220) 18% var(--core-l,96%) / .26);
  border-color:hsl(var(--h,220) 26% var(--core-bd-l,99%) / .92);
  color:var(--core-tx,#0a0c15);
  box-shadow:0 0 50px -12px hsl(var(--h,220) 72% var(--core-glow-l,88%) / .58),
             0 0 132px -30px hsl(var(--h,220) 72% var(--core-glow-l,88%) / .38)
}
html.hotcore .node.root::before{
  background:radial-gradient(circle,
    hsl(var(--h,220) 72% var(--core-glow-l,88%) / .34) 0%,
    hsl(var(--h,220) 72% var(--core-glow-l,88%) / .12) 36%,
    transparent 68%)
}
/* 访问过：二级以下照旧变实心蓝，根和一级保留自己的光，只挂一枚实心小点 */
.node.visited:not(.root):not(.t1){background:rgba(var(--acc1),.9);color:var(--onaccent);border-color:transparent}
.node.visited.root::after,.node.visited.t1::after{
  content:"";position:absolute;right:-6px;top:-6px;width:9px;height:9px;border-radius:50%;
  background:rgba(var(--acc1),1);box-shadow:0 0 10px rgba(var(--acc1),.8);pointer-events:none
}
.skins{position:fixed;right:20px;top:16px;z-index:60;display:flex;align-items:center;gap:4px;padding:6px 10px 6px 12px;border-radius:999px;background:rgba(var(--surf),.94);border:1px solid var(--line);font-size:12px;color:var(--muted);transition:opacity .3s}
.skins b{font-weight:400;color:var(--dim);letter-spacing:.14em;margin-right:6px}
.skins button{background:none;border:1px solid transparent;color:var(--muted);font-family:inherit;font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer;transition:.25s}
.skins button:hover{color:var(--ink)}
.skins button.on{color:var(--onaccent);background:var(--accent);border-color:transparent}
.skins .kbd{color:var(--dim);font-size:11px;margin-left:6px;letter-spacing:.04em}
.skins .dv{width:1px;height:15px;background:var(--line);margin:0 5px}
body:has(.panel.open) .skins{opacity:0;pointer-events:none}
</style>

<script>
/* ============ 工具 ============ */
var seq = 0;
function uid(){ return 'n' + (++seq); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function hashStr(s){ var h=0; for (var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; } return Math.abs(h); }
function shortLabel(s, n){ n = n || 16; return s.length > n ? s.slice(0, n) + '…' : s; }

/* 问题相似度：先剥掉疑问词和语气词，只留下"主题" */
var STOPW = ['什么','是','的','吗','呢','怎么','怎样','如何','为什么','为啥','请问','意思','一下','到底','究竟','有哪些','介绍','请','我','想','要','搞懂','明白','了解'];
function topicTokens(s){
  s = String(s).replace(/[\s？?。！!，,、；;：:]/g, '');
  for (var i=0;i<STOPW.length;i++) s = s.split(STOPW[i]).join('');
  return s;
}
function bigrams(x){
  var g = {};
  if (x.length < 2){ if (x) g[x] = 1; return g; }
  for (var i=0;i<x.length-1;i++){ var k = x.substr(i,2); g[k] = (g[k]||0) + 1; }
  return g;
}
function sim(a, b){
  var x = topicTokens(a), y = topicTokens(b);
  if (!x || !y) return 0;
  if (x === y) return 1;
  if (x.indexOf(y) >= 0 || y.indexOf(x) >= 0) return 0.72;
  var ga = bigrams(x), gb = bigrams(y), inter = 0, uni = 0, k;
  for (k in ga) if (gb[k]) inter++;
  for (k in ga) uni++;
  for (k in gb) if (!ga[k]) uni++;
  return uni ? inter/uni : 0;
}

/* ============ 状态 ============ */
var NODES = {};       /* id -> node  （kind: question | concept） */
var LECTURES = {};    /* nodeId -> 该节点专属的讲义（追问的回答就走这里） */
var EDGES = [];
var CLUSTERS = {};
var INDEX = {};       /* label -> [nodeId]，模拟 embedding 的概念身份 */
var HUES = [222, 282, 190, 320, 45];
function indexAdd(n){ if (!INDEX[n.label]) INDEX[n.label] = []; INDEX[n.label].push(n.id); }

/* ============ 内容 ============ */
var CONTENT = {
 '梯度下降': {s:'一种沿着梯度反方向小步前进，逐步降低损失的优化方法。',
  common:'大多数人以为：梯度下降是在"寻找最低点"。',
  insight:'其实它只做一件事 —— 每一步都只相信脚下的坡度。所以它永远不知道整座山长什么样，停在哪里完全取决于从哪儿出发。',
  scene:'你被空投到一座大雾弥漫的山上，要走到谷底。你看不见地图，只能感觉到脚下哪边最陡。于是你朝下坡方向迈一小步，再重新感觉一次，再迈一步。',
  mechanism:['这个"感觉脚下哪边最陡"的量，就是<t>梯度</t>；"朝它的反方向迈一步"，就是全部的动作。',
             '把这一步原样写下来，就是下面这个式子 —— 后面所有优化方法，都是它的注脚：'],
  formula:{ tex:'θ_{t+1} = θ_t − η ∇L(θ_t)',
    read:'新的参数 = 旧的参数 − 学习率 × 当前的梯度',
    symbols:[['θ','参数，也就是模型内部那些可调的数字'],['η','学习率：每一步迈多大'],['∇L','损失函数在这一点的梯度，指向最陡的上坡方向']] },
  bounds:'它的快慢完全取决于山的形状。如果山谷又窄又长，它会在两壁之间来回震荡，走很久都到不了底 —— 这时要靠<t>动量</t>或<t>学习率衰减</t>来救场。',
  misconceptions:['以为它在"寻找最低点"。其实它只是"一直往低处走"，停在哪里取决于从哪里出发。','以为它保证找到全局最低点。它大概率只给你一个足够好的坑。'],
  p:[]},
 '机器学习': {s:'让计算机从数据里自己找出规律，而不是由人把规则写死。',
  p:['传统程序是人写规则、机器执行；机器学习反过来 —— 人给数据和答案，机器自己总结规则。',
     '它整件事的核心动作，就是不断调整参数去降低<t>损失函数</t>，而调整的方式通常依赖<t>学习率</t>。',
     '最危险的失败不是学不会，而是<t>过拟合</t>：把训练数据背得滚瓜烂熟，却认不出新样本。']},
 '损失函数': {s:'衡量模型预测和真实答案差多少的那把尺子。',
  p:['训练模型的本质，就是把损失降到最低。它像一个裁判，你每走一步，它都告诉你现在有多差。',
     '不同的任务会用不同的尺子：预测数值时常用<t>均方误差</t>，做分类时常用<t>交叉熵</t>。']},
 '学习率': {s:'决定每一步迈多大的超参数。',
  common:'大多数人以为：学习率越小越稳妥，慢慢来总没错。',
  insight:'其实它能开多大，是被损失函数的曲率锁死的 —— 有一条精确的不等式在管着它；而太小会让你根本走不到谷底。',
  scene:'同一个山口，两个人下山：一个每次迈 10 厘米，天黑还没到山脚；另一个每次迈 10 米，一步跨过谷底，摔到对面山上。',
  mechanism:['学习率 η 乘在<t>梯度</t>前面，直接决定参数每次移动的距离。','而它能开多大有一个硬上限 —— 取决于山最陡的地方有多陡：'],
  formula:{ tex:'η < 2 / λ_{max}',
    read:'学习率必须小于 2 除以最大曲率',
    symbols:[['λmax','损失函数最大的曲率，也就是 Hessian 矩阵的最大特征值'],['2','来自二次型的推导，不是经验常数']] },
  bounds:'这条不等式在曲率恒定的情形下是精确的；而真实网络的曲率每一步都在变，所以实践中还要靠<t>学习率衰减</t>与<t>动量</t>动态应对。',
  misconceptions:['"越小越稳"听上去安全，其实是用训练时间换稳定 —— 很多时候你根本等不到它收敛。','以为学习率是一个全局的数。实际上不同层、不同方向需要的步长可以差几个数量级。'],
  p:[]},
 '反向传播': {s:'从输出往回走，一层层算出每个参数该负多少责任。',
  p:['反向传播是<t>梯度下降</t>能够工作的前提 —— 它负责把梯度真正算出来。',

function genericSpecs(topic){

  for (i=0;i<GENERIC_POOL.length;i++) idx.push(i);
  for (i=idx.length-1;i>0;i--){ h = (h*1103515245 + 12345) & 0x7fffffff; var j = h % (i+1); var t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
  var out = [];
  for (i=0;i<4;i++) out.push(GENERIC_POOL[idx[i]]);
  return out;
}

function makeNode(cl, parent, label, rel, why, x, y){
  var id = uid();
  var n = { id:id, kind: parent ? 'concept' : 'question', label:label, cluster:cl.id,
    parentId: parent ? parent.id : null, x:x, y:y, rel:rel, why:why,
    visited:false, children:[], crossIds:[], manualIds:[] };
  NODES[id] = n;
  if (parent) parent.children.push(id);
  cl.nodeIds.push(id);
  indexAdd(n);
  return n;
}
/* 同一个概念被两个问题分别拽出来 → 各自一个投影，之间留一条"航线"（默认不画） */
function linkCross(n){
  var list = INDEX[n.label] || [];
  for (var i=0;i<list.length;i++){
    var o = NODES[list[i]];
    if (o.id === n.id || o.cluster === n.cluster) continue;
    n.crossIds.push(o.id);
    o.crossIds.push(n.id);
    EDGES.push({a:n.id, b:o.id, cluster:n.cluster, cross:true});
    markShared(n); markShared(o);
  }
}
function markShared(n){
  n.el && n.el.classList.add('shared');
  if (n.el && !n.el.querySelector('.mk')){
    var s = document.createElement('span');
    s.className = 'mk'; s.textContent = '◈';
    n.el.appendChild(s);
  }
}
function layoutChildren(cl, parent, specs){
  if (!specs || !specs.length) return;
  var isRoot = !parent.parentId;
  var base = isRoot ? -Math.PI/2 : Math.atan2(parent.y - cl.cy, parent.x - cl.cx);
  for (var i=0;i<specs.length;i++){
    var spec = specs[i];
    var a = isRoot ? base + i*(2*Math.PI/specs.length) : base + (i-(specs.length-1)/2)*0.85;
    var r = isRoot ? 205 + (i%2)*28 : 148 + (i%2)*24;
    var n = makeNode(cl, parent, spec[0], spec[1], spec[2], parent.x + Math.cos(a)*r, parent.y + Math.sin(a)*r);
    n.question = spec[3] || null;
    EDGES.push({a:parent.id, b:n.id, cluster:cl.id});
    linkCross(n);
  }
}
function createCluster(name, cx, cy, specs){
  var key = Object.keys(CLUSTERS).length;
  var id = 'c' + (key + 1);
  var cl = { id:id, name:name, cx:cx, cy:cy, hue:HUES[key % HUES.length], nodeIds:[], aliases:[] };
  CLUSTERS[id] = cl;
  var root = makeNode(cl, null, name, null, null, cx, cy);
  cl.rootId = root.id;
  layoutChildren(cl, root, specs);
  return cl;
}
function freeSpot(){
  var existing = [];
  for (var cid in CLUSTERS) existing.push(CLUSTERS[cid]);
  var radii = [1500, 1850, 2250, 2700, 3200], best = null, bestD = -1;
  for (var ri=0; ri<radii.length; ri++){
    for (var a=0; a<16; a++){
      var ang = a*(2*Math.PI/16) + ri*0.29;
      var x = Math.cos(ang)*radii[ri], y = Math.sin(ang)*radii[ri]*0.62;
      var d = 1e9;
      for (var i=0;i<existing.length;i++){
        var dx = x-existing[i].cx, dy = y-existing[i].cy;
        var dd = Math.sqrt(dx*dx + dy*dy);
        if (dd < d) d = dd;
      }
      if (d > 900) return {x:x, y:y};
      if (d > bestD){ bestD = d; best = {x:x, y:y}; }
    }
  }
  return best || {x:0, y:0};
}

function depthOf(n){
  var d = 0, p = n.parentId;
  while (p && NODES[p] && d < 12){ d++; p = NODES[p].parentId; }
  return d;
}
function applyTier(n, el){
  var d = depthOf(n);

function mount(){

    var ln = document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1', NODES[e.a].x); ln.setAttribute('y1', NODES[e.a].y);
    ln.setAttribute('x2', NODES[e.b].x); ln.setAttribute('y2', NODES[e.b].y);
    ln.dataset.id = e.a + '_' + e.b;
    if (e.cross) ln.setAttribute('class', 'cross');
    linksSvg.appendChild(ln);
    e.el = ln;
  }
  for (var id in NODES){
    var n = NODES[id];
    if (n.el){ applyTier(n, n.el); continue; }
    var d = document.createElement('div');
    d.className = 'node';
    if (n.kind === 'question') d.classList.add('q');
    applyTier(n, d);   /* 层级：0 恒星 / 1 行星 / ≥2 卫星 */
    if (n.crossIds && n.crossIds.length) d.classList.add('shared');
    d.style.left = n.x + 'px';
    d.style.top  = n.y + 'px';
    var hue = CLUSTERS[n.cluster].hue;
    d.style.setProperty('--h', hue);
    var inner = '';
    if (n.kind === 'question') inner += '<span class="qmk">✦</span>';
    inner += shortLabel(n.label);
    if (n.crossIds && n.crossIds.length) inner += '<span class="mk">◈</span>';
    if (n.rel) inner += '<span class="rel">' + n.rel + '</span>';
    d.innerHTML = inner;
    d.dataset.id = id;
    d.addEventListener('mousedown', function(ev){
      ev.stopPropagation();
      startClusterDrag(NODES[this.dataset.id].cluster, ev);
    });
    d.addEventListener('click', function(ev){
      ev.stopPropagation();
      if (suppressClick){ suppressClick = false; return; }
      var nid = this.dataset.id;
      if (laneForced){ laneClick(nid); return; }
      openNode(nid);
      focusNode(nid, Math.max(V.k, 1.0));
    });
    world.appendChild(d);
    n.el = d;
  }
  for (var cid in CLUSTERS){
    var cl = CLUSTERS[cid];
    if (cl.labelEl) continue;
    var l = document.createElement('div');
    l.className = 'clabel';
    l.textContent = shortLabel(cl.name, 12);
    l.style.left = cl.cx + 'px';

}

/* ============ 小地图 ============ */

  mmView.style.top  = (offy + ((-V.py)/V.k - b.minY)*s) + 'px';

function laneClick(id){

  }
  var keep = {}, cur = currentId ? NODES[currentId] : null;
  hiddenIds = {};
  for (var id in NODES){
    var n = NODES[id];
    var vis = false;
    if (!n.parentId) vis = true;                                  /* 星团原点永远在 */
    if (n.visited) vis = true;                                    /* 走过的路永远在 */
    if (n.rel === '追问') vis = true;                             /* 你亲口问过的 */
    if (cur && (n.id === cur.id || n.parentId === cur.id)) vis = true;  /* 当前节点的下一步 */
    keep[id] = vis;

/* ============ 拖动 / 缩放 ============ */
var cdrag = null, suppressClick = false, onClusterDrop = null;
function startClusterDrag(clusterId, ev){
  var cl = CLUSTERS[clusterId];
  cdrag = { id:clusterId, sx:ev.clientX, sy:ev.clientY, ocx:cl.cx, ocy:cl.cy, moved:false };
  document.body.style.cursor = 'grabbing';
}
function moveCluster(cid, nx, ny){
  var cl = CLUSTERS[cid];
  var dx = nx - cl.cx, dy = ny - cl.cy;
  for (var i=0;i<cl.nodeIds.length;i++){
    var n = NODES[cl.nodeIds[i]];
    n.x += dx; n.y += dy;
    if (n.el){ n.el.style.left = n.x + 'px'; n.el.style.top = n.y + 'px'; }
  }
  cl.cx = nx; cl.cy = ny;
  if (cl.labelEl){ cl.labelEl.style.left = nx + 'px'; cl.labelEl.style.top = (ny - 300) + 'px'; }
  mmDirty = true;
  redrawEdges(); updateMinimap();
}
function bindViewport(){
  var dragging = false, moved = false, sx=0, sy=0, ox=0, oy=0;
  viewport.addEventListener('mousedown', function(e){
    dragging = true; moved = false; sx = e.clientX; sy = e.clientY; ox = V.px; oy = V.py;
    viewport.classList.add('dragging');
  });
  window.addEventListener('mousemove', function(e){
    if (cdrag){
      var ddx = (e.clientX - cdrag.sx)/V.k, ddy = (e.clientY - cdrag.sy)/V.k;
      if (Math.abs(ddx) > 3 || Math.abs(ddy) > 3) cdrag.moved = true;
      if (cdrag.moved) moveCluster(cdrag.id, cdrag.ocx + ddx, cdrag.ocy + ddy);
      return;
    }
    if (!dragging) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    V.px = ox + dx; V.py = oy + dy; apply();
  });
  window.addEventListener('mouseup', function(){
    if (cdrag){
      var draggedId = cdrag.id, didMove = cdrag.moved;
      if (didMove) suppressClick = true;
      cdrag = null; document.body.style.cursor = '';
      if (didMove && onClusterDrop) onClusterDrop(draggedId);
      return;
    }
    if (!dragging) return;
    dragging = false;
    viewport.classList.remove('dragging');
    if (!moved){ panel.classList.remove('open'); currentId = null; autoLanes(); refreshVisibility(); }
  });
  viewport.addEventListener('wheel', function(e){
    e.preventDefault();
    var rect = viewport.getBoundingClientRect();
    var mxp = e.clientX - rect.left, myp = e.clientY - rect.top;
    var wx = (mxp - V.px)/V.k, wy = (myp - V.py)/V.k;
    var k2 = clamp(V.k * (e.deltaY < 0 ? 1.13 : 1/1.13), 0.2, 2.6);
    V.px = mxp - wx*k2; V.py = myp - wy*k2; V.k = k2;
    apply();
  }, {passive:false});
}
function bindMinimap(){
  minimap.addEventListener('mousedown', function(e){
    e.stopPropagation();
    var g = mmGeo(), b = g.b, s = g.s;
    var rect = minimap.getBoundingClientRect();
    var wx = (e.clientX - rect.left - g.offx)/s + b.minX;
    var wy = (e.clientY - rect.top  - g.offy)/s + b.minY;
    setView(wx, wy, V.k, true);
  });
}

/* ============ 合并两个星团 ============ */
function recolorNode(n, hue){
  if (!n.el) return; n.el.style.setProperty('--h', hue);
  
  
  
}
function removeNode(id){
  var n = NODES[id];
  if (!n) return;
  if (n.el && n.el.parentNode) n.el.parentNode.removeChild(n.el);
  for (var i=EDGES.length-1;i>=0;i--){
    var e = EDGES[i];
    if (e.a === id || e.b === id){
      if (e.el && e.el.parentNode) e.el.parentNode.removeChild(e.el);
      EDGES.splice(i,1);
    }
  }
  if (n.parentId && NODES[n.parentId]){
    var pc = NODES[n.parentId].children, idx = pc.indexOf(id);
    if (idx >= 0) pc.splice(idx,1);
  }
  if (INDEX[n.label]){
    var k = INDEX[n.label].indexOf(id);
    if (k >= 0) INDEX[n.label].splice(k,1);
  }
  for (var m in NODES){
    if (NODES[m].crossIds){
      var p = NODES[m].crossIds.indexOf(id);
      if (p >= 0) NODES[m].crossIds.splice(p,1);
    }
  }
  delete NODES[id];
}
function mergeCluster(srcId, dstId){
  var src = CLUSTERS[srcId], dst = CLUSTERS[dstId];
  if (!src || !dst || src === dst) return;
  var srcRoot = NODES[src.rootId], dstRoot = NODES[dst.rootId];
  if (!srcRoot || !dstRoot) return;
  if (dst.aliases.indexOf(src.name) < 0) dst.aliases.push(src.name);
  for (var a=0;a<src.aliases.length;a++) if (dst.aliases.indexOf(src.aliases[a]) < 0) dst.aliases.push(src.aliases[a]);

  var kids = srcRoot.children.slice();
  for (var k=0;k<kids.length;k++){
    var ch = NODES[kids[k]];
    if (!ch) continue;
    ch.parentId = dstRoot.id;
    ch.cluster = dst.id;
    dstRoot.children.push(ch.id);
    dst.nodeIds.push(ch.id);
    EDGES.push({ a:dstRoot.id, b:ch.id, cluster:dst.id });
  }
  removeNode(srcRoot.id);

  for (var j=0;j<src.nodeIds.length;j++){
    var id = src.nodeIds[j];
    if (!NODES[id]) continue;
    NODES[id].cluster = dst.id;
    dst.nodeIds.push(id);
    recolorNode(NODES[id], dst.hue);
  }
  if (src.labelEl && src.labelEl.parentNode) src.labelEl.parentNode.removeChild(src.labelEl);
  delete CLUSTERS[srcId];
  mount(); updateMinimap(); buildMenu();
  relayoutCluster(dst);
  showToast('两个问题已经合成一个');
}

/* 合并后重排：把根的一圈子节点均匀铺开，整棵子树跟着平移 */
var tweenToken = 0;
function tweenPositions(moves, dur){
  var my = ++tweenToken;          /* 新补间一开，旧补间自动停，避免互相打架 */
  var t0 = performance.now();
  function step(t){
    if (my !== tweenToken) return;
    var p = Math.min(1, (t - t0)/dur), e = 1 - Math.pow(1-p, 3);
    for (var i=0;i<moves.length;i++){
      var m = moves[i];
      m.node.x = m.fx + (m.tx - m.fx)*e;
      m.node.y = m.fy + (m.ty - m.fy)*e;
      if (m.node.el){ m.node.el.style.left = m.node.x + 'px'; m.node.el.style.top = m.node.y + 'px'; }
    }
    mmDirty = true;
    syncLabels(); redrawEdges(); updateMinimap();
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function syncLabels(){
  for (var cid in CLUSTERS){
    var cl = CLUSTERS[cid], rt = NODES[cl.rootId];
    if (cl.labelEl && rt){ cl.labelEl.style.left = rt.x + 'px'; cl.labelEl.style.top = (rt.y - 300) + 'px'; }
  }
}
/* 全局布局：每个星团按径向树铺开，再把互相重叠的星团推开，最后一次性补间 */
var LAYOUT_R = 212, CLUSTER_CAP = 820, GAP = 150;
function layoutAll(animate){
  var plan = [], cnt = {}, off = {};
  for (var cid in CLUSTERS){
    var cl = CLUSTERS[cid];
    var root = NODES[cl.rootId];
    if (!root) continue;
    cnt = {}; off = {};
    (function calc(n){
      var c = 0;
      for (var i=0;i<n.children.length;i++){ var k = NODES[n.children[i]]; if (k) c += calc(k); }
      if (c === 0) c = 1;
      cnt[n.id] = c; return c;
    })(root);
    (function place(n, a0, a1, depth, sib){
      if (depth > 0){
        var a = (a0 + a1)/2;
        var r = LAYOUT_R * depth + (sib % 2) * 34;
        off[n.id] = { dx: Math.cos(a)*r, dy: Math.sin(a)*r };
      }
      var kids = [];
      for (var i=0;i<n.children.length;i++){ var k = NODES[n.children[i]]; if (k) kids.push(k); }
      if (!kids.length) return;
      var total = 0;
      for (var i=0;i<kids.length;i++) total += cnt[kids[i].id];
      var cur = a0, span = a1 - a0;
      for (var i=0;i<kids.length;i++){
        var share = span * (cnt[kids[i].id] / total);
        place(kids[i], cur, cur + share, depth + 1, i);
        cur += share;
      }
    })(root, -Math.PI/2, -Math.PI/2 + 2*Math.PI, 0, 0);
    /* 算这个星团的实际半径；太深就整体缩一点，别让一个星团无限膨胀 */
    var maxR = 340;
    for (var nid in off){
      var nn = NODES[nid];
      if (!nn) continue;
      var rr = Math.sqrt(off[nid].dx*off[nid].dx + off[nid].dy*off[nid].dy) + nn.label.length * 7 + 44;
      if (rr > maxR) maxR = rr;
    }
    if (maxR > CLUSTER_CAP){
      var k2 = CLUSTER_CAP / maxR;
      for (var nid2 in off){ off[nid2].dx *= k2; off[nid2].dy *= k2; }
      maxR = CLUSTER_CAP;
    }
    cl._off = off; cl._radius = maxR;
    plan.push(cl);
  }
  /* 只推开真正重叠的星团，两边各让一半 */
  for (var iter=0; iter<90; iter++){
    var moved = false;
    for (var i=0;i<plan.length;i++){
      for (var j=i+1;j<plan.length;j++){
        var A = plan[i], B = plan[j];
        var dx = B.cx - A.cx, dy = B.cy - A.cy;
        var d = Math.sqrt(dx*dx + dy*dy) || 0.01;
        var need = A._radius + B._radius + GAP;
        if (d < need){
          var push = (need - d)/2, ux = dx/d, uy = dy/d;
          A.cx -= ux*push; A.cy -= uy*push;
          B.cx += ux*push; B.cy += uy*push;
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
  /* 汇总成一次补间 */
  var moves = [];
  for (var p=0;p<plan.length;p++){
    var cl2 = plan[p], root2 = NODES[cl2.rootId];
    moves.push({ node: root2, fx: root2.x, fy: root2.y, tx: cl2.cx, ty: cl2.cy });
    for (var nid3 in cl2._off){
      var n3 = NODES[nid3];
      if (!n3) continue;
      moves.push({ node: n3, fx: n3.x, fy: n3.y, tx: cl2.cx + cl2._off[nid3].dx, ty: cl2.cy + cl2._off[nid3].dy });
    }
  }
  if (!moves.length) return;
  if (animate === false){
    for (var m=0;m<moves.length;m++){
      moves[m].node.x = moves[m].tx; moves[m].node.y = moves[m].ty;
      if (moves[m].node.el){ moves[m].node.el.style.left = moves[m].node.x + 'px'; moves[m].node.el.style.top = moves[m].node.y + 'px'; }
    }
    mmDirty = true;
    syncLabels(); redrawEdges(); updateMinimap();
  } else {
    tweenPositions(moves, 640);
  }
}
function relayoutCluster(cl, animate){ layoutAll(animate); }
function relayoutNode(parentId, animate){ layoutAll(animate); }

  document.getElementById('chips').addEventListener('click', function(e){

  });

  function locate(node, msg){
    landing.classList.add('gone');
    uni.classList.add('on');
    started = true;
    buildMenu();
    setTimeout(function(){ openNode(node.id); setView(node.x, node.y, 1.0, true); }, 260);

  }

  var pending = null;

  function openCard(title, text, primary, secondary){
    document.getElementById('mbT').textContent = title;
    document.getElementById('mbQ').textContent = text;
    document.getElementById('mbSame').textContent = primary;
    document.getElementById('mbNew').textContent = secondary;

  }
  function closeCard(){ document.getElementById('mergeBox').classList.remove('on'); pending = null; }

  /* 输入里提到了图里已有的概念吗？取最长匹配 */
  function mentionedConcept(q){
    var best = null;
    for (var id in NODES){
      var n = NODES[id];
      if (n.kind !== 'concept' || n.label.length < 2) continue;
      if (q.indexOf(n.label) >= 0 && (!best || n.label.length > best.length)) best = n.label;
    }
    return best;
  }

  function createNew(q, anchorLabel){
    var spot = freeSpot();
    var specs = childrenOf(q);
    if (!specs.length){
      specs = genericSpecs(q);
      if (anchorLabel){
        specs = specs.filter(function(s){ return s[0] !== anchorLabel; });
        specs.unshift([anchorLabel, '已有', '你之前问过这个概念']);
      }
    }
    var nc = createCluster(q, spot.x, spot.y, specs);
    mount();
    revealCluster(nc, 500);
    landing.classList.add('gone'); uni.classList.add('on'); started = true;
    buildMenu();
    var lane = false;
    for (var i=0;i<nc.nodeIds.length;i++){ if (NODES[nc.nodeIds[i]].crossIds.length) lane = true; }
    setTimeout(function(){ setView(nc.cx, nc.cy, 1.0, true); }, 120);
    setTimeout(function(){ openNode(nc.rootId); }, 900);
    if (lane) setTimeout(function(){ showToast('它和你之前问过的概念连上了航线'); }, 1300);
  }

  function enter(){
    var q = (input.value || '梯度下降').trim();
    if (!q) return;

    /* 1. 一模一样的问题 */
    for (var cid in CLUSTERS){
      if (CLUSTERS[cid].name === q){
        var cl = CLUSTERS[cid];
        landing.classList.add('gone'); uni.classList.add('on'); started = true; buildMenu();
        setTimeout(function(){ setView(cl.cx, cl.cy, 1.0, true); }, 120);
        setTimeout(function(){ openNode(cl.rootId); }, 700);
        showToast('这个问题已经在你的星图里了');
        return;
      }
    }
    /* 2. 输入本身就是图里已有的概念 → 定位 */
    for (var id in NODES){
      var n = NODES[id];
      if (n.parentId && n.label === q){
        locate(n, '「' + shortLabel(q, 12) + '」已经在你的星图里了 · 已为你定位');
        return;
      }
    }
    /* 3. 问题里提到了已有的概念 → 问一句 */
    var mc = mentionedConcept(q);
    if (mc){
      pending = { type:'concept', q:q, label:mc };
      openCard('这个问题里有一个你学过的概念', '「' + mc + '」', '带我看看它', '我要问个新的');
      return;
    }
    /* 4. 很像的旧问题 → 问一句，绝不擅自合并 */
    var best = null, bestS = 0;
    for (var cid2 in CLUSTERS){
      var s2 = sim(q, CLUSTERS[cid2].name);
      if (s2 > bestS){ bestS = s2; best = CLUSTERS[cid2]; }
    }
    if (best && bestS >= 0.5){
      pending = { type:'merge', q:q, cl:best };
      openCard('你好像问过一个很像的问题', '「' + best.name + '」', '算同一个 · 带我去', '不一样 · 问新的');
      return;
    }
    /* 5. 全新的问题 → 新星团 */
    createNew(q);
  }
  document.getElementById('mbSame').addEventListener('click', function(){
    if (!pending) return;
    var p = pending; closeCard();
    if (p.type === 'cluster'){ mergeCluster(p.src, p.dst); return; }
    if (p.type === 'merge'){
      if (p.cl.aliases.indexOf(p.q) < 0) p.cl.aliases.push(p.q);
      landing.classList.add('gone'); uni.classList.add('on'); started = true; buildMenu();
      setTimeout(function(){ setView(p.cl.cx, p.cl.cy, 1.0, true); }, 120);
      setTimeout(function(){ openNode(p.cl.rootId); }, 700);
      showToast('已并入同一个问题');
      return;
    }
    for (var id in NODES){
      if (NODES[id].parentId && NODES[id].label === p.label){
        locate(NODES[id], '已为你定位到「' + p.label + '」');
        return;
      }
    }
  });
  document.getElementById('mbNew').addEventListener('click', function(){
    if (!pending) return;
    var p = pending; closeCard();
    if (p.type === 'cluster') return;
    createNew(p.q, p.type === 'concept' ? p.label : null);
  });
  document.getElementById('go').addEventListener('click', enter);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') enter(); });

  document.getElementById('brandBtn').addEventListener('click', function(e){
    e.stopPropagation(); document.getElementById('menu').classList.toggle('open');
  });
  document.addEventListener('click', function(){ document.getElementById('menu').classList.remove('open'); });
  var focusBtn = document.getElementById('focusBtn');
  focusBtn.addEventListener('click', function(){
    focusMode = !focusMode;
    focusBtn.classList.toggle('active', focusMode);
    refreshVisibility();
    showToast(focusMode ? '只显示你走过的路' : '显示全部节点');
  });

  laneBtn.addEventListener('click', function(){
    laneForced = !laneForced;
    clearPick();
    if (laneForced){
      panel.classList.remove('open');
      currentId = null;
    }
    autoLanes();
    refreshVisibility();
    showToast(laneForced ? '航线模式：点两个节点把它们连起来（再点一次可删除）' : '已退出航线模式');
  });

  document.getElementById('followBtn').addEventListener('click', askFollow);
  document.getElementById('followInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') askFollow(); });

  var mergeMode = false;
  var mergeBtn = document.getElementById('mergeBtn');
  mergeBtn.addEventListener('click', function(){
    mergeMode = !mergeMode;
    mergeBtn.classList.toggle('active', mergeMode);
    showToast(mergeMode ? '合并模式：把一个星团拖到另一个上面' : '已退出合并模式');
  });
  onClusterDrop = function(srcId){
    if (!mergeMode) return;
    var src = CLUSTERS[srcId];
    if (!src) return;
    var best = null, bestD = 1e9;
    for (var cid in CLUSTERS){
      if (cid === srcId) continue;
      var c = CLUSTERS[cid];
      var dx = c.cx - src.cx, dy = c.cy - src.cy;
      var d = Math.sqrt(dx*dx + dy*dy);
      if (d < bestD){ bestD = d; best = c; }
    }
    if (best && bestD < 720){
      pending = { type:'cluster', src:srcId, dst:best.id };
      openCard('这两个问题要合成一个吗', '「' + shortLabel(src.name,10) + '」 ＋ 「' + shortLabel(best.name,10) + '」', '合并', '还是分开');
    } else {
      showToast('把它拖到另一个星团上面，就能合并');
    }
  };
  document.getElementById('zIn').addEventListener('click', function(){
    setView((viewport.clientWidth/2 - V.px)/V.k, (viewport.clientHeight/2 - V.py)/V.k, clamp(V.k*1.35,0.2,2.6), true);
  });
  document.getElementById('zOut').addEventListener('click', function(){
    setView((viewport.clientWidth/2 - V.px)/V.k, (viewport.clientHeight/2 - V.py)/V.k, clamp(V.k/1.35,0.2,2.6), true);
  });
  document.getElementById('fitBtn').addEventListener('click', fitAll);
  document.getElementById('homeBtn').addEventListener('click', function(){
    uni.classList.remove('on');
    landing.classList.remove('gone');
    panel.classList.remove('open');
    currentId = null; laneForced = false; autoLanes(); refreshVisibility();
  });
  document.getElementById('closeBtn').addEventListener('click', function(){
    panel.classList.remove('open'); currentId = null; autoLanes(); refreshVisibility();
  });
  document.getElementById('regenBtn').addEventListener('click', function(){
    if (!currentId) return;
    var rn = NODES[currentId];
    if (!rn) return;
    if (typeof LIVE === 'undefined' || !LIVE){
      showToast('离线模式用的是模拟数据，接上本地服务后才能重新生成');
      return;
    }
    delete LECTURES[currentId];                       /* 清前端缓存 */
    this.classList.add('spin');
    renderLive(rn, CLUSTERS[rn.cluster], true);       /* true = 绕过服务端缓存 */
    showToast('正在重新生成…');
  });
  document.querySelectorAll('#ptabs button').forEach(function(b){
    b.addEventListener('click', function(){ setTab(this.dataset.tab); });
  });
  document.getElementById('backBtn').addEventListener('click', function(){
    var prev = historyStack.pop();
    if (prev){ openNode(prev, false); focusNode(prev, Math.max(V.k,1.0)); }
  });
  window.addEventListener('resize', function(){ apply(); });
});
</script>
<div class="skins" id="skinsBar">
  <b>配色</b>
  <button data-t="star">星夜</button>
  <button data-t="morandi">莫兰迪</button>
  <button data-t="ink">宣纸</button>
  <button data-t="inknight">墨夜</button>
  <button data-t="blue">学术蓝</button>
  <span class="dv"></span>
  <b>根节点</b>
  <button data-c="hue">同色更亮</button>
  <button data-c="hot">白光核</button>
  <span class="kbd">T 轮换 · C 切根 · 1–5</span>
</div>
<script>
(function(){
  var order=['star','morandi','ink','inknight','blue'];
  var cores=['hue','hot'];
  var bar=document.getElementById('skinsBar');
  function rd(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function wr(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function fromUrl(k,list,def){var m=location.search.match(new RegExp('[?&]'+k+'=([a-z]+)'));return (m&&list.indexOf(m[1])>=0)?m[1]:def}
  var cur=fromUrl('t',order,rd('skin')||'star'); if(order.indexOf(cur)<0)cur='star';
  var core=fromUrl('c',cores,rd('core')||'hue'); if(cores.indexOf(core)<0)core='hue';
  function mark(attr,val){
    var bs=bar.getElementsByTagName('button');
    for(var i=0;i<bs.length;i++){var b=bs[i];if(b.hasAttribute(attr))b.className=(b.getAttribute(attr)===val)?'on':''}
  }
  function apply(v){
    cur=v;
    document.documentElement.setAttribute('data-theme',v);
    wr('skin',v);
    mark('data-t',v);
  }
  function setCore(v){
    core=v;
    document.documentElement.classList.toggle('hotcore',v==='hot');
    wr('core',v);
    mark('data-c',v);
  }
  function pick(ev,attr,fn){
    var el=ev.target;
    while(el&&el!==bar){
      if(el.tagName==='BUTTON'&&el.hasAttribute(attr)){fn(el.getAttribute(attr));return true}
      el=el.parentNode;
    }
    return false;
  }
  bar.addEventListener('click',function(ev){
    if(pick(ev,'data-t',apply))return;
    pick(ev,'data-c',setCore);
  });
  document.addEventListener('keydown',function(ev){
    var tg=ev.target;
    if(tg&&(/^(INPUT|TEXTAREA)$/.test(tg.tagName)||tg.isContentEditable))return;
    var k=ev.key;
    if(k==='t'||k==='T'){apply(order[(order.indexOf(cur)+1)%order.length])}
    else if(k==='c'||k==='C'){setCore(core==='hot'?'hue':'hot')}
    else if(k>='1'&&k<='5'){apply(order[Number(k)-1])}
  });
  apply(cur);
  setCore(core);
})();
</script>
</body>
</html>
